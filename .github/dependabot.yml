version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One pull request for the whole toolchain. Every dependency here is a dev
      # dependency of the same build, and a separate pull request per package
      # rewrites pnpm-lock.yaml, so they all conflict with each other the moment
      # one of them lands.
      dependencies:
        patterns: ['*']
    ignore:
      # TypeScript 7 breaks the declaration build. tsup 8.5.1
      # bundles rollup-plugin-dts 6.1.1, whose use of the compiler API throws
      # "Cannot read properties of undefined (reading
      # 'useCaseSensitiveFileNames')". tsup 8.5.1 is the latest release and an
      # override cannot reach a bundled dependency, so the toolchain stays on
      # TypeScript 6 until tsup ships support.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    # A bare "/" only scans .github/workflows, which would leave the versions
    # pinned inside the composite action unwatched.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
