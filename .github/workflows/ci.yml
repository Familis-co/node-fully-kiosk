name: CI

on:
  pull_request:
  # The release workflow calls this one for main, so pushes there are already
  # covered. Changesets' release branch never opens a pull request of its own,
  # so it is the one branch that still needs a push trigger.
  push:
    branches: ['changeset-release/**']
  workflow_call:
  workflow_dispatch:

concurrency:
  # `github.workflow` keeps a called run in a group of its own, so a release
  # never contends with the pull request run it grew out of.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request run is worth cancelling. A run that gates a
  # release is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Nothing in CI needs the git hooks the root `prepare` script installs.
  LEFTHOOK: '0'

jobs:
  static:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 refuses to start on anything below Node 22.13, so the
        # toolchain cannot run on older Node versions.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm run build

      - name: Check that the package can be packed
        run: pnpm --filter "@familis/node-fully-kiosk" exec npm pack --pack-destination "$RUNNER_TEMP"
