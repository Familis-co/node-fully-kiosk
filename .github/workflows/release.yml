name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nothing is versioned or published from a commit that does not pass the same
  # checks a pull request has to pass.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Version or publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required twice over: the OIDC token this mints is what authenticates the
      # publish, and it is also what lets the registry attach a provenance
      # statement to the tarball.
      id-token: write
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets compares against the full history to decide what to release.
          fetch-depth: 0
          # A personal access token lifts two limits on GITHUB_TOKEN: an
          # organisation can forbid Actions from opening pull requests, and a
          # push made with GITHUB_TOKEN never triggers another workflow. The
          # fallback keeps the job working without the secret.
          token: ${{ secrets.GITHUB_TOKEN }}

      # No `registry-url`, and so no generated .npmrc: publishing authenticates
      # over OIDC instead of a token, and an .npmrc carrying an empty
      # `_authToken` would send an empty credential and pre-empt the exchange.
      - uses: ./.github/actions/setup

      # Publishing is authorised by npm trusted publishing, not by a secret:
      # the package on npmjs.com names this repository and this workflow file
      # as its trusted publisher, and pnpm trades the job's OIDC token for a
      # short lived registry credential. Renaming this file, or moving the
      # publish into a called workflow, breaks that match.
      - name: Open a release pull request or publish
        uses: changesets/action@v2
        with:
          # v2 renamed every input this step uses: `version`, `publish`,
          # `commit` and `title` no longer exist under those names.
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          # v2 stopped reading a token from the environment; the action now
          # takes one only through this input.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Still needed despite the input above, and by a different consumer:
          # `changeset version` runs @changesets/changelog-github, which reads
          # GITHUB_TOKEN itself and throws outright when it is missing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Changesets shells out to `pnpm publish` and never passes
          # --provenance, so the flag is supplied as configuration instead.
          NPM_CONFIG_PROVENANCE: 'true'
