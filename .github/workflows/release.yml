name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LEFTHOOK: '0'

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required so the registry can attach a provenance statement to the tarball.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate with npm
        # pnpm 11 no longer trusts auth settings in a repository .npmrc, so the
        # token goes into the user level config the way pnpm documents.
        run: pnpm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Open a release pull request or publish
        uses: changesets/action@v1
        with:
          # Builds, then publishes: see the `release` script.
          version: pnpm run version-packages
          publish: pnpm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Changesets shells out to `pnpm publish` and never passes
          # --provenance, so the flag is supplied as configuration instead.
          NPM_CONFIG_PROVENANCE: 'true'
