# Git hooks. Run `pnpm install` once and lefthook wires these up automatically
# through the root `prepare` script.

pre-commit:
  jobs:
    - name: oxlint
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
      run: pnpm exec oxlint --fix --deny-warnings --report-unused-disable-directives --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,md,mdx,yml,yaml}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm run typecheck
    - name: test
      run: pnpm run test

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        head -n1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/_-]+\))?!?: .{1,}' \
          || { echo "Commit message must follow Conventional Commits, e.g. 'feat(core): add screenOn command'"; exit 1; }
