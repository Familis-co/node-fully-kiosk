packages:
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true

# Shared dependency versions. Packages reference these with `catalog:` so every
# workspace package builds and tests against the exact same toolchain.
catalog:
  '@types/node': ^24.5.0
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@testing-library/react': ^16.3.0
  '@vitest/coverage-v8': ^3.2.0
  happy-dom: ^20.11.2
  react: ^19.2.0
  react-dom: ^19.2.0
  tsup: ^8.5.0
  typescript: ^5.9.0
  vitest: ^3.2.0

linkWorkspacePackages: true
savePrefix: ^
