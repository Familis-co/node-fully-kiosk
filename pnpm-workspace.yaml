packages:
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true

# tsup 8.5.1 still requests esbuild 0.27.x, which is affected by
# GHSA-g7r4-m6w7-qqqr. Its public API usage is compatible with the fixed line.
overrides:
  esbuild: ^0.28.2

# Shared dependency versions. Packages reference these with `catalog:` so every
# workspace package builds and tests against the exact same toolchain.
catalog:
  '@types/node': ^26.6.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@testing-library/react': ^16.3.3
  '@vitest/coverage-v8': ^5.0.2
  happy-dom: ^20.14.5
  react: ^19.3.0
  react-dom: ^19.3.0
  tsup: ^8.5.1
  typescript: ^6.0.3
  vitest: ^5.0.2

linkWorkspacePackages: true
savePrefix: ^
