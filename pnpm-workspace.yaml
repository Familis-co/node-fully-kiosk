packages:
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true

# Shared dependency versions. Packages reference these with `catalog:` so every
# workspace package builds and tests against the exact same toolchain.
catalog:
  '@types/node': ^26.4.1
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.7
  '@testing-library/react': ^16.3.3
  '@vitest/coverage-v8': ^5.0.0
  happy-dom: ^20.14.0
  react: ^19.2.0
  react-dom: ^19.2.0
  tsup: ^8.5.0
  typescript: ^6.0.3
  vitest: ^5.0.0

linkWorkspacePackages: true
savePrefix: ^
